<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Auto Unlocker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background: #030712; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    @keyframes strokeCheck { 100% { stroke-dashoffset: 0; } }
    .checkmark { width: 70px; height: 70px; border-radius: 50%; display: block; stroke-width: 3; stroke: #fff; margin: 10px auto; background: #10b981; }
    .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke: #10b981; fill: none; animation: strokeCheck 0.6s forwards; }
    .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: strokeCheck 0.35s 0.6s forwards; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

  <!-- ADMIN BUILDER -->
  <div id="adminPanel" class="w-full max-w-md card rounded-3xl p-6 hidden">
    <h2 class="text-xl font-bold mb-4 text-emerald-400">Create Auto-Unlock Link</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Target URL</label>
        <input type="url" id="targetUrl" placeholder="https://..." class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm outline-none focus:border-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">UPI Receiver</label>
        <select id="upiSelect" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm outline-none">
          <option value="9173456004@fam">FamPay (9173456004@fam)</option>
          <option value="9173456004@nyes">NaviBOB (9173456004@nyes)</option>
          <option value="limbachiya660@naviaxis">NaviPost (limbachiya660@naviaxis)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Base Price (₹)</label>
        <input type="number" id="baseAmount" value="10" min="1" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-sm outline-none mono">
      </div>
      <button onclick="createMasterLink()" id="btnGen" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition">
        Generate Link
      </button>
    </div>
    <div id="outputBox" class="mt-4 pt-4 border-t border-slate-800 hidden">
      <input type="text" id="shareUrl" readonly class="w-full p-2.5 bg-slate-950 text-xs rounded-xl border border-slate-800 text-emerald-400 mono mb-2">
      <button onclick="copyLink()" class="w-full py-2 bg-slate-800 text-xs font-semibold rounded-xl hover:bg-slate-700">Copy Link</button>
    </div>
  </div>

  <!-- USER CHECKOUT -->
  <div id="userPanel" class="w-full max-w-sm card rounded-3xl p-6 text-center hidden">
    <div id="waitingState">
      <span class="inline-block px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-full mb-3">Live Active Session</span>
      <h3 class="text-lg font-bold mb-1">Scan & Pay Exact Amount</h3>
      <p class="text-xs text-slate-400 mb-3">Do not change the amount</p>

      <div class="py-2.5 px-4 bg-slate-950 rounded-2xl border border-slate-800 mb-3">
        <span class="text-[10px] text-slate-500 uppercase font-bold block">Exact Amount to Pay</span>
        <span id="displayAmt" class="text-3xl font-bold text-emerald-400 mono">₹0.00</span>
      </div>

      <div class="p-3 bg-white rounded-2xl w-fit mx-auto mb-4">
        <div id="qrcode"></div>
      </div>

      <a id="upiPayBtn" href="#" class="block w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm rounded-xl mb-3">
        Pay with UPI App
      </a>

      <p class="text-[11px] text-amber-300 bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-xl">
        Wait 1-2 minutes after completing payment for automated bank verification.
      </p>
    </div>

    <!-- SUCCESS STATE -->
    <div id="successState" class="hidden py-8">
      <svg class="checkmark" viewBox="0 0 52 52">
        <circle class="checkmark__circle" cx="26" cy="26" r="25"/>
        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
      <h3 class="text-lg font-bold text-white mt-3">Payment Verified!</h3>
      <p class="text-xs text-emerald-400 mt-1">Redirecting...</p>
    </div>
  </div>

  <script>
    const FIREBASE = "https://download-apks-adc2c-default-rtdb.firebaseio.com";
    const urlParams = new URLSearchParams(window.location.search);
    const linkId = urlParams.get('id');

    if (!linkId) {
      document.getElementById('adminPanel').classList.remove('hidden');
    } else {
      document.getElementById('userPanel').classList.remove('hidden');
      initSession(linkId);
    }

    async function createMasterLink() {
      const url = document.getElementById('targetUrl').value.trim();
      const upi = document.getElementById('upiSelect').value;
      const base = parseInt(document.getElementById('baseAmount').value) || 10;
      if (!url) return alert("Enter Target URL");

      const masterId = "lnk_" + Math.random().toString(36).substring(2, 8);
      await fetch(`${FIREBASE}/campaigns/${masterId}.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ targetUrl: url, upiId: upi, baseAmount: base })
      });

      document.getElementById('shareUrl').value = `${window.location.origin}${window.location.pathname}?id=${masterId}`;
      document.getElementById('outputBox').classList.remove('hidden');
    }

    function copyLink() {
      const el = document.getElementById('shareUrl');
      el.select();
      navigator.clipboard.writeText(el.value);
      alert("Link Copied!");
    }

    async function initSession(id) {
      const res = await fetch(`${FIREBASE}/campaigns/${id}.json`);
      const camp = await res.json();
      if (!camp) return alert("Expired or Invalid Link!");

      const sessionKey = `lock_session_${id}`;
      let orderKey = localStorage.getItem(sessionKey);

      if (!orderKey) {
        const paise = Math.floor(Math.random() * 89) + 10; // 10 to 98
        const fullAmt = `${camp.baseAmount}.${paise}`;
        // Unique key without dot: amt_1045
        orderKey = `amt_${camp.baseAmount}${paise}`;

        await fetch(`${FIREBASE}/orders/${orderKey}.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            targetUrl: camp.targetUrl,
            amount: fullAmt,
            status: "PENDING"
          })
        });

        localStorage.setItem(sessionKey, orderKey);
      }

      const ordRes = await fetch(`${FIREBASE}/orders/${orderKey}.json`);
      const ord = await ordRes.json();

      if (ord.status === "PAID") return unlock(ord.targetUrl);

      document.getElementById('displayAmt').innerText = '₹' + ord.amount;

      const upiUri = `upi://pay?pa=${encodeURIComponent(camp.upiId)}&pn=DigitalStore&am=${ord.amount}&cu=INR&tn=Order${orderKey}`;
      document.getElementById('upiPayBtn').href = upiUri;

      new QRCode(document.getElementById("qrcode"), {
        text: upiUri,
        width: 160,
        height: 160,
        correctLevel: QRCode.CorrectLevel.M
      });

      const timer = setInterval(async () => {
        try {
          const r = await fetch(`${FIREBASE}/orders/${orderKey}/status.json`);
          const st = await r.json();
          if (st === "PAID") {
            clearInterval(timer);
            unlock(ord.targetUrl);
          }
        } catch(e) {}
      }, 1500);
    }

    function unlock(target) {
      document.getElementById('waitingState').classList.add('hidden');
      document.getElementById('successState').classList.remove('hidden');
      setTimeout(() => { window.location.href = target; }, 1000);
    }
  </script>
</body>
</html>
